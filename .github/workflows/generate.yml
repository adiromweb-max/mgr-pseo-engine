name: MGR pSEO Engine

# Automatic: every Monday and Thursday (GitHub may start it a few hours late) - up to 4 new live pages per run.
# Manual: Actions tab -> Run workflow (choose batch / live / limit).
on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Which batch to generate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - quickwins
      live:
        description: 'Push to WordPress? (unchecked = dry run, files only)'
        required: true
        default: false
        type: boolean
      limit:
        description: 'Max pages this run'
        required: true
        default: '4'
        type: string
  schedule:
    - cron: '17 6 * * 1,4'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python run.py --batch all --live --limit 4 2>&1 | tee run.log
          else
            LIVE_FLAG=""
            if [ "${{ github.event.inputs.live }}" = "true" ]; then LIVE_FLAG="--live"; fi
            python run.py --batch ${{ github.event.inputs.batch }} $LIVE_FLAG --limit ${{ github.event.inputs.limit }} 2>&1 | tee run.log
          fi

      - name: Upload generated pages (for review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-pages
          path: output/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit state file (anti-duplication tracking)
        if: always()
        run: |
          git config user.name "mgr-engine-bot"
          git config user.email "bot@a-webm.com"
          git add data/generation_state.json || true
          git commit -m "Update generation state [skip ci]" || echo "no changes"
          git pull --rebase || true
          git push || echo "nothing to push"

      - name: Notify Adi (summary / failure alert)
        if: always()
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m engine.notify generate ${{ job.status }} run.log
